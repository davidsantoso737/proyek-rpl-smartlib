{% if telegram_has_phone %}
    <form method="post" action="{% url 'telegram:link_start' %}" class="mt-3">
        {% csrf_token %}
        <button type="submit"
                class="inline-flex min-h-[44px] items-center justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            {{ start_label|default:"Ajukan penautan Telegram" }}
        </button>
    </form>
{% else %}
    <p class="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="status">
        Lengkapi nomor HP di formulir profil di atas, simpan, lalu muat ulang halaman ini untuk menghubungkan Telegram.
    </p>
{% endif %}
