{% extends "base.html" %}

{% block title %}Akses Ditolak - Digital Library{% endblock %}

{% block content %}

<div class="flex items-center justify-center py-10">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl shadow-slate-200 border border-slate-100 p-8 text-center">
        <div class="mx-auto mb-4 flex items-center justify-center w-14 h-14 rounded-2xl bg-red-100 text-red-600 text-2xl font-bold">
            !
        </div>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">
            Akses ditolak (403)
        </h1>
        <p class="text-slate-500 text-sm mb-6">
            {% if exception %}
                {{ exception }}
            {% else %}
                Anda tidak memiliki hak akses ke halaman ini.
            {% endif %}
        </p>
        <a href="{% url 'accounts:dashboard' %}"
           class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-sm">
            Kembali ke dashboard
        </a>
    </div>
</div>

{% endblock %}
